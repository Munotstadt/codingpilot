name: Import Turso Security Prices

on:
  schedule:
    # 03:00 und 15:00 UTC täglich
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Import security prices from Turso
        run: python scripts/import_turso_security_prices.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/security_prices_recent.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import Turso security prices ($(date -u +%Y-%m-%dT%H:%M))"
            git push
          fi
